# Publishes a release's data pack zip and mod jar to Modrinth, CurseForge and the
# GitHub release itself.
#
# Set up once, per platform:
#   - Modrinth:    repo variable MODRINTH_ID (project id or slug) + secret MODRINTH_TOKEN
#   - CurseForge:  repo variable CURSEFORGE_ID (numeric project id) + secret CURSEFORGE_TOKEN
# mc-publish skips any platform whose token is missing, so a half-configured repo still
# publishes to the rest. Each token is gated on its id: the tokens are organization
# secrets, and handed a token with no id mc-publish guesses a slug and fails the run.
#
# To release: bump "version" in fabric/fabric.mod.json, push to main, then run
# release.sh, which pushes a v<that version> tag. The last step creates the GitHub
# release with generated notes.

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read pack version
        id: pack
        run: |
          . ./version.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the release tag matches the pack version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match fabric/fabric.mod.json version $VERSION (expected v$VERSION)." >&2
            exit 1
          fi

      - name: Build
        run: |
          ./build-datapack-zip.sh
          ./build-mod-jar.sh

      # The zip and the jar go up as two separate versions, not one version with two
      # files. A version's primary file is the one its loader installs, so a jar riding
      # along in a data pack version is an uninstallable supplementary download — the
      # Modrinth app would never offer it as a mod. Splitting them also means each
      # version declares only its own loaders, and Modrinth only runs a loader's
      # validator over the files of a version that declares it.
      - name: Publish the data pack
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: build/insta-grow-datapack-*.zip

          # "+datapack" / "+mod" are semver build metadata: same release, two version
          # numbers, because a project cannot hold two versions with the same number.
          version: ${{ steps.pack.outputs.version }}+datapack
          name: ${{ steps.pack.outputs.version }} (data pack)

          loaders: datapack
          # A single version, not a range: the loot-condition and advancement
          # schemas changed in 26.3, so the pack is 26.3-only. Raise this alongside
          # pack.mcmeta's min_format / max_format when a new version is tested.
          game-versions: "26.3"
          # A single flag value, not a list: mc-publish parses this as one
          # LoaderEnvironmentType, and "both" means required on client and server.
          environment: both

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ vars.MODRINTH_ID != '' && secrets.MODRINTH_TOKEN || '' }}

          # Deliberately no CurseForge here. mc-publish only sends CurseForge's
          # Client/Server ids from the environment group when it also resolved at
          # least one mod loader id — `loaderIds.length ? gameVersionIds.concat(
          # loaderIds, environmentIds, javaIds) : gameVersionIds` in
          # curseforge-upload-api-client.ts — and "datapack" is not a CurseForge
          # loader, so it resolves to nothing. The upload then arrives with no entry
          # from the environment group and CurseForge rejects the whole run with
          # errorCode 1021. Only the first id variant is ever tried, so there is no
          # fallback to recover from it. The jar below declares fabric and neoforge,
          # resolves loaders, and publishes to CurseForge fine — that is what
          # CurseForge users install anyway.

      - name: Publish the mod
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          # One jar, not one per loader: Modrinth runs every declared loader's
          # validator over every file with a matching extension, so a Fabric-only
          # jar in a version that also declares neoforge is rejected.
          files: build/insta-grow-*.jar

          version: ${{ steps.pack.outputs.version }}+mod
          name: ${{ steps.pack.outputs.version }} (mod)

          loaders: |
            fabric
            neoforge
          game-versions: "26.3"
          environment: both

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ vars.MODRINTH_ID != '' && secrets.MODRINTH_TOKEN || '' }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ vars.CURSEFORGE_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}

      # A GitHub release has no loaders and no version of its own, so both artifacts
      # hang off the one release. Kept in its own step so neither upload above creates
      # or renames it.
      - name: Publish the GitHub release
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: |
            build/insta-grow-datapack-*.zip
            build/insta-grow-*.jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-generate-changelog: true
          name: Insta Grow ${{ steps.pack.outputs.version }}
          version: ${{ steps.pack.outputs.version }}
          version-type: release
